name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout game
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run unit and deployment tests
        run: npm test
      - name: Build production game
        run: npm run build
      - name: Check resources and repository-relative paths
        run: node scripts/check-pages-build.mjs
      - name: Upload game only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Show game link
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Game is published at $GAME_URL" >> "$GITHUB_STEP_SUMMARY"
